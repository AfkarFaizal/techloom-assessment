<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>E-Commerce Checkout & Payment</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />
<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/htm@3/dist/htm.umd.js"></script>
<style>
  :root{--bg:#0b1020;--card:#161c33;--accent:#a78bfa;--good:#22c55e;--bad:#ef4444;--warn:#f59e0b;--text:#e5e7eb;}
  *{box-sizing:border-box;}
  body{font-family:system-ui,Arial,sans-serif;background:var(--bg);color:var(--text);margin:0;}
  header{padding:16px 24px;background:#0f1530;position:sticky;top:0;display:flex;gap:16px;align-items:center;flex-wrap:wrap;z-index:5;}
  header input,header select{padding:8px;border-radius:6px;border:1px solid #2a3155;background:#0b1020;color:var(--text);}
  main{padding:24px;max-width:1100px;margin:0 auto;}
  .tabs{display:flex;gap:8px;margin-bottom:16px;}
  .tab{padding:8px 14px;border-radius:20px;cursor:pointer;background:#1e2545;font-size:14px;}
  .tab.active{background:var(--accent);color:#0b1020;font-weight:600;}
  .gridp{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:16px;}
  .card{background:var(--card);border-radius:12px;padding:14px;}
  .price{color:var(--accent);font-weight:700;}
  button{cursor:pointer;border:none;border-radius:6px;padding:8px 12px;font-weight:600;background:var(--accent);color:#0b1020;}
  button.secondary{background:#2a3155;color:var(--text);}
  button.danger{background:var(--bad);color:#fff;}
  button:disabled{opacity:.4;cursor:not-allowed;}
  .badge{padding:2px 8px;border-radius:10px;font-size:12px;font-weight:700;}
  .Reserved{background:var(--warn);color:#000;} .Paid{background:var(--good);color:#000;}
  .Cancelled,.Failed,.Expired{background:var(--bad);color:#fff;}
  .row{display:flex;justify-content:space-between;align-items:center;margin:6px 0;}
  .timer{color:var(--warn);font-weight:700;}
  .muted{color:#8b93b8;font-size:13px;}
</style>
</head>
<body>
<div id="root"></div>
<script src="./config.js"></script>
<script type="module">
import htm from 'https://unpkg.com/htm@3/dist/htm.module.js';
const html = htm.bind(React.createElement);
const { useState, useEffect, useCallback } = React;

const API = window.API_BASE || 'http://localhost:4002';
const USER_ID = 'demo-user'; // simplified: no auth for this assessment demo

async function api(path, opts={}) {
  const res = await fetch(API + path, { headers: {'Content-Type':'application/json'}, ...opts });
  return res.json();
}

function fmtCountdown(ms){
  if(ms<=0) return 'expired';
  const s = Math.floor(ms/1000);
  return `${Math.floor(s/60)}m ${s%60}s`;
}

function App(){
  const [tab, setTab] = useState('shop');
  const [products, setProducts] = useState([]);
  const [categories, setCategories] = useState([]);
  const [search, setSearch] = useState('');
  const [category, setCategory] = useState('');
  const [maxPrice, setMaxPrice] = useState('');
  const [cart, setCart] = useState({}); // id -> qty
  const [orders, setOrders] = useState([]);
  const [detail, setDetail] = useState(null);
  const [, force] = useState(0);

  const loadProducts = useCallback(async () => {
    const q = new URLSearchParams();
    if(search) q.set('search', search);
    if(category) q.set('category', category);
    if(maxPrice) q.set('maxPrice', maxPrice);
    setProducts(await api('/products?' + q.toString()));
  }, [search, category, maxPrice]);

  const loadOrders = useCallback(async () => {
    setOrders(await api('/orders?userId=' + USER_ID));
  }, []);

  useEffect(() => { api('/products/categories').then(setCategories); loadOrders(); }, []);
  useEffect(() => { loadProducts(); }, [loadProducts]);
  useEffect(() => { const t = setInterval(() => { loadOrders(); force(x=>x+1); }, 4000); return () => clearInterval(t); }, [loadOrders]);

  const addToCart = (id) => setCart(c => ({...c, [id]: (c[id]||0)+1}));
  const removeFromCart = (id) => setCart(c => { const n = {...c}; delete n[id]; return n; });

  const checkout = async () => {
    const items = Object.entries(cart).map(([productId, qty]) => ({productId, qty}));
    if(items.length===0) return alert('Cart is empty');
    const res = await api('/cart/checkout', {method:'POST', body: JSON.stringify({userId: USER_ID, items})});
    if(res.error){ alert(res.error); return; }
    setCart({});
    await loadProducts(); await loadOrders();
    setTab('orders');
  };

  const pay = async (id, outcome) => {
    await api(`/orders/${id}/pay`, {method:'POST', body: JSON.stringify({outcome, idempotencyKey: id+'-'+outcome})});
    await loadProducts(); await loadOrders();
  };
  const cancel = async (id) => {
    await api(`/orders/${id}/cancel`, {method:'POST'});
    await loadProducts(); await loadOrders();
  };

  return html`
    <div>
      <header>
        <b>🛒 MiniShop</b>
        <input placeholder="Search products..." value=${search} onInput=${e=>setSearch(e.target.value)} />
        <select value=${category} onChange=${e=>setCategory(e.target.value)}>
          <option value="">All categories</option>
          ${categories.map(c => html`<option value=${c}>${c}</option>`)}
        </select>
        <input placeholder="Max price" type="number" style=${{width:'100px'}} value=${maxPrice} onInput=${e=>setMaxPrice(e.target.value)} />
        <div style=${{marginLeft:'auto'}}>Cart: ${Object.values(cart).reduce((a,b)=>a+b,0)} items</div>
      </header>
      <main>
        <div class="tabs">
          <div class=${'tab ' + (tab==='shop'?'active':'')} onClick=${()=>setTab('shop')}>Shop</div>
          <div class=${'tab ' + (tab==='cart'?'active':'')} onClick=${()=>setTab('cart')}>Cart & Checkout</div>
          <div class=${'tab ' + (tab==='orders'?'active':'')} onClick=${()=>setTab('orders')}>Order History</div>
        </div>

        ${tab==='shop' && html`
          <div class="gridp">
            ${products.map(p => html`
              <div class="card">
                <div style=${{fontWeight:600}}>${p.name}</div>
                <div class="muted">${p.category}</div>
                <div class="price">$${p.price.toFixed(2)}</div>
                <div class="muted">${p.available>0 ? p.available+' in stock' : 'Out of stock'}</div>
                <div class="row">
                  <button class="secondary" onClick=${()=>setDetail(p)}>Details</button>
                  <button disabled=${p.available<=0} onClick=${()=>addToCart(p.id)}>Add to cart</button>
                </div>
              </div>
            `)}
          </div>
        `}

        ${tab==='cart' && html`
          <div class="card">
            <h3>Your cart</h3>
            ${Object.keys(cart).length===0 && html`<p class="muted">Cart is empty</p>`}
            ${Object.entries(cart).map(([id,qty]) => {
              const p = products.find(p=>p.id===id);
              return html`<div class="row"><span>${p?p.name:id} × ${qty}</span><button class="secondary" onClick=${()=>removeFromCart(id)}>remove</button></div>`;
            })}
            ${Object.keys(cart).length>0 && html`<button onClick=${checkout} style=${{marginTop:'10px'}}>Checkout → Reserve stock (5 min hold)</button>`}
          </div>
        `}

        ${tab==='orders' && html`
          <div>
            ${orders.length===0 && html`<p class="muted">No orders yet</p>`}
            ${orders.map(o => html`
              <div class="card" style=${{marginBottom:'10px'}}>
                <div class="row">
                  <b>#${o.id.slice(0,8)}</b>
                  <span class=${'badge ' + o.status}>${o.status}${o.refunded ? ' (refunded)' : ''}</span>
                </div>
                <div class="muted">${o.items.map(i=>`${i.qty}× ${i.productName}`).join(', ')} — total $${o.total.toFixed(2)}</div>
                ${o.status==='Reserved' && o.expiresAt && html`<div class="timer">Expires in ${fmtCountdown(o.expiresAt-Date.now())}</div>`}
                <div class="row" style=${{marginTop:'8px', gap:'8px'}}>
                  ${o.status==='Reserved' && html`
                    <button onClick=${()=>pay(o.id,'success')}>Pay ✓</button>
                    <button class="secondary" onClick=${()=>pay(o.id,'failure')}>Pay ✗ fail</button>
                    <button class="secondary" onClick=${()=>pay(o.id,'timeout')}>Pay ⧗ timeout</button>
                    <button class="danger" onClick=${()=>cancel(o.id)}>Cancel</button>
                  `}
                  ${o.status==='Paid' && html`<button class="danger" onClick=${()=>cancel(o.id)}>Cancel & Refund</button>`}
                </div>
              </div>
            `)}
          </div>
        `}

        ${detail && html`
          <div style=${{position:'fixed',inset:0,background:'rgba(0,0,0,.6)',display:'flex',alignItems:'center',justifyContent:'center'}} onClick=${()=>setDetail(null)}>
            <div class="card" style=${{maxWidth:'400px'}} onClick=${e=>e.stopPropagation()}>
              <h3>${detail.name}</h3>
              <p class="muted">${detail.description}</p>
              <p>Category: ${detail.category}</p>
              <p class="price">$${detail.price.toFixed(2)}</p>
              <p class="muted">${detail.available} available</p>
              <button onClick=${()=>{addToCart(detail.id); setDetail(null);}} disabled=${detail.available<=0}>Add to cart</button>
              <button class="secondary" onClick=${()=>setDetail(null)}>Close</button>
            </div>
          </div>
        `}
      </main>
    </div>
  `;
}

ReactDOM.createRoot(document.getElementById('root')).render(html`<${App} />`);
</script>
</body>
</html>
